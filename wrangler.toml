name = "mok1"
main = "src/index.ts"
compatibility_date = "2026-08-04"
# 生产路由走自定义域；Preview 见 [previews] 与 docs/previews.md
workers_dev = false

[observability]
enabled = true

[observability.traces]
enabled = true

# Worker Previews（Wrangler ≥ 4.135）：非生产隔离环境；D1/KV 接入时在此覆盖预发 id

# ...
[previews.observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true
persist = true

[previews.observability.traces]
enabled = true
head_sampling_rate = 1
persist = true
# ...

