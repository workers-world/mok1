name = "mok1"
main = "src/index.ts"
compatibility_date = "2026-10-01"
# 生产路由走自定义域；Preview 见 [previews] 与 docs/previews.md
workers_dev = false

upload_source_maps = true

[observability]
enabled = true

[observability.traces]
enabled = true

# BOR1 账号级 Browser 网关（mok1 不绑 [browser]）
# 公开仓不写 [[secrets_store_secrets]]；TOKEN 用 Worker 级 secret put，见 docs/previews.md
[[services]]
binding = "SVC_BROWSER_RUN"
service = "browser-run"

[previews.observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true
persist = true

[previews.observability.traces]
enabled = true
head_sampling_rate = 1
persist = true
