name: SDK Golden Verify

# framework_sdk_worker publish 后触发，或手动 workflow_dispatch 复现。
on:
  workflow_dispatch:
    inputs:
      sdk_version:
        description: '@workers-world/framework_sdk_worker 版本'
        required: true
        type: string
  repository_dispatch:
    types: [sdk-published]

jobs:
  golden:
    runs-on: ${{ vars.GHA_RUNNER != '' && vars.GHA_RUNNER || 'ubuntu-latest' }}
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          registry-url: https://npm.pkg.github.com
          scope: '@workers-world'

      - name: Pin SDK version
        env:
          SDK_VERSION: ${{ github.event.inputs.sdk_version || github.event.client_payload.version }}
        run: |
          set -euo pipefail
          if [ -z "${SDK_VERSION}" ]; then
            echo "::error::缺少 SDK 版本：手动触发须填 sdk_version，repository_dispatch 须带 client_payload.version；拒绝静默回退旧版"
            exit 1
          fi
          echo "Using framework_sdk_worker@${SDK_VERSION}"
          npm pkg set "dependencies.framework_sdk_worker=npm:@workers-world/framework_sdk_worker@${SDK_VERSION}"

      # npm pkg set 改了 package.json 后与 lockfile 必不同步，npm ci 会 EUSAGE 失败；
      # 用 --no-save 安装（按改动后的 package.json 解析、不回写 package.json / package-lock.json）
      - name: Install deps (pinned SDK)
        run: npm install --no-save
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - run: npm run test:golden
