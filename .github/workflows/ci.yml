on:
  push:
    branches: ["dev_*"]
  pull_request:
    branches: ["master"]
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  release-pr:
    permissions:
      contents: write
      packages: read
      pull-requests: write
      issues: write
      actions: write
      checks: read
    uses: workers-world/worker-actions/.github/workflows/worker-ci.yml@actions/v0.2.62
    secrets:
      GHA_TOKEN: ${{ secrets.GHA_TOKEN }}
      RELEASE_BOT_PRIVATE_KEY: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
      RELEASE_BOT_APP_ID: ${{ secrets.RELEASE_BOT_APP_ID }}
      QODANA_TOKEN: ${{ secrets.QODANA_TOKEN }}
      NOTIFY_GHA_TOKEN: ${{ secrets.NOTIFY_GHA_TOKEN }}
    with:
      materialize_sdk: true
      sync_packages_lock: true
      correctness_on_builds: true
          # measure: #221 R8 clear Builds fault-injection (keep correctness_on_builds)